<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça ao Maior e Menor</title>
    <link rel="stylesheet" href="ex003.css">
</head>
<body>
    <div class="container">
        <h1>Procurando o maior e o menor número</h1>
        <input type="number" id="numero" placeholder="Digite um número">

        <button onclick="adicionar()">Adicionar Número</button><br><br>

        <button onclick="verificar()">Clique para verificar os números</button>

        <h2>Números digitados:</h2>
        <p id="lista"></p>

        <h3>Resultado do maior e menor:</h3>
        <p id="resultado"></p>

    </div>

    <script src="ex003.js"></script>
</body>
</html>
